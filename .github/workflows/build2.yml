name: Build TARS MicroPython ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone MicroPython
        run: |
          git clone --depth 1 https://github.com/micropython/micropython.git

      - name: Build firmware using ESP-IDF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/code \
            -w /code/micropython \
            espressif/idf:release-v5.4 \
            bash -c "
              make -C mpy-cross &&
              make -C ports/esp32 submodules &&
              . /opt/esp/idf/export.sh &&
              make -C ports/esp32 BOARD=ESP32_GENERIC
            "

      - name: Copy firmware
        run: |
          mkdir -p output
          cp micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin \
             output/TARS-MicroPython-ESP32.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32
          path: output/TARS-MicroPython-ESP32.bin
