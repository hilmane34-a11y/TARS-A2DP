      - name: Create A2DP board configuration
        run: |
          mkdir -p \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP

          cp -a \
            micropython/ports/esp32/boards/ESP32_GENERIC/. \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/

          cat > \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/sdkconfig.a2dp \
            <<'EOF'
          CONFIG_BT_ENABLED=y
          CONFIG_BT_BLUEDROID_ENABLED=y
          CONFIG_BT_NIMBLE_ENABLED=n
          CONFIG_BT_CLASSIC_ENABLED=y
          CONFIG_BT_A2DP_ENABLE=y
          CONFIG_BT_SPP_ENABLED=y
          CONFIG_BTDM_CTRL_MODE_BTDM=y
          EOF

          cat > \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/mpconfigboard.cmake \
            <<'EOF'
          set(SDKCONFIG_DEFAULTS
              boards/sdkconfig.base
              ${MICROPY_BOARD_DIR}/sdkconfig.a2dp
          )
          EOF

          cat >> \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/mpconfigboard.h \
            <<'EOF'

          // TARS menggunakan Bluetooth Classic A2DP.
          // NimBLE bawaan MicroPython dimatikan.
          #undef MICROPY_PY_BLUETOOTH
          #define MICROPY_PY_BLUETOOTH (0)

          #undef MICROPY_PY_BLUETOOTH_LE
          #define MICROPY_PY_BLUETOOTH_LE (0)

          EOF
