name: Build TARS MicroPython ESP32

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout TARS repository
        uses: actions/checkout@v4

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          path: micropython
          submodules: recursive

      - name: Checkout ESP-IDF
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v5.5
          path: esp-idf
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESP-IDF dependencies
        shell: bash
        run: |
          cd esp-idf
          ./install.sh esp32

      - name: Show project structure
        shell: bash
        run: |
          echo "===== ROOT ====="
          ls -la

          echo ""
          echo "===== MODULES ====="
          find modules -maxdepth 3 -type f | sort || true

      - name: Build MicroPython ESP32
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython/ports/esp32"

          rm -rf build-ESP32_GENERIC

          make \
            BOARD=ESP32_GENERIC \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            ESPIDF="$GITHUB_WORKSPACE/esp-idf"

      - name: Verify TARS modules
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC"

          echo "=================================================="
          echo "CHECK FIRMWARE"
          echo "=================================================="

          ls -lh "$BUILD"/*.bin || true

          echo ""
          echo "=================================================="
          echo "MODULEDEFS.COLLECTED TARS"
          echo "=================================================="

          grep -n \
            -E "tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr/moduledefs.collected" \
            || true

          echo ""
          echo "=================================================="
          echo "MODULEDEFS.H TARS"
          echo "=================================================="

          grep -n \
            -E "TARS_A2DP|TARS_BLUETOOTH|tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr/moduledefs.h" \
            || true

          echo ""
          echo "=================================================="
          echo "SOURCE REGISTRATION"
          echo "=================================================="

          grep -n \
            -E "MP_REGISTER_MODULE.*tars_a2dp|MP_REGISTER_MODULE.*tars_bluetooth" \
            "$GITHUB_WORKSPACE/modules/tars_a2dp/tars_a2dp.c" \
            "$GITHUB_WORKSPACE/modules/tars_bluetooth/tars_bluetooth.c" \
            || true

      - name: Copy firmware files
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p firmware

          find "$BUILD" \
            -maxdepth 2 \
            -type f \
            \( -name "*.bin" \) \
            -exec cp {} firmware/ \;

          echo "===== FIRMWARE FILES ====="
          ls -lh firmware

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-UTAMA-V1
          path: firmware/
          if-no-files-found: error
