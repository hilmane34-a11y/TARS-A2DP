name: Build TARS MicroPython ESP32 A2DP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout TARS repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone \
            --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython

      - name: Setup MicroPython submodules
        run: |
          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1

      - name: Clone ESP-IDF
        run: |
          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0

      - name: Install ESP-IDF
        run: |
          cd esp-idf

          ./install.sh esp32

      - name: Build mpy-cross
        run: |
          cd micropython
          make -C mpy-cross

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules

      - name: Install TARS custom board
        shell: bash
        run: |
          BOARD_DIR="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP"

          mkdir -p "$BOARD_DIR"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.h" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.cmake" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/partitions.csv" \
            "$BOARD_DIR/"

          echo "=================================================="
          echo "TARS CUSTOM BOARD FILES"
          echo "=================================================="

          ls -la "$BOARD_DIR"

          echo ""
          echo "=================================================="
          echo "MPCONFIGBOARD.H"
          echo "=================================================="

          cat "$BOARD_DIR/mpconfigboard.h"

          echo ""
          echo "=================================================="
          echo "MPCONFIGBOARD.CMAKE"
          echo "=================================================="

          cat "$BOARD_DIR/mpconfigboard.cmake"

          echo ""
          echo "=================================================="
          echo "SDKCONFIG BLUETOOTH"
          echo "=================================================="

          cat "$BOARD_DIR/sdkconfig.bluetooth"

          echo ""
          echo "=================================================="
          echo "PARTITIONS.CSV"
          echo "=================================================="

          cat "$BOARD_DIR/partitions.csv"

      - name: Build TARS MicroPython A2DP
        id: build_tars
        shell: bash
        continue-on-error: true
        run: |
          set +e

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf ports/esp32/build-TARS_ESP32_A2DP

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            2>&1 | tee "$GITHUB_WORKSPACE/tars_build.log"

          BUILD_RESULT=${PIPESTATUS[0]}

          echo "BUILD_EXIT_CODE=$BUILD_RESULT" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "BUILD EXIT CODE: $BUILD_RESULT"
          echo "=================================================="

          exit 0

      - name: Diagnose build
        if: always()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"
          FULL_LOG="$GITHUB_WORKSPACE/tars_build.log"

          echo "=================================================="
          echo "BUILD RESULT"
          echo "=================================================="

          echo "BUILD_EXIT_CODE=${BUILD_EXIT_CODE:-unknown}"

          echo ""
          echo "=================================================="
          echo "FIRST BUILD ERRORS"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then
            grep -n -m 30 \
              -E "fatal error:|error:|undefined reference|CMake Error|FAILED:|partition is too small|overflow" \
              "$FULL_LOG" \
              || true
          else
            echo "FULL BUILD LOG NOT FOUND"
          fi

          echo ""
          echo "=================================================="
          echo "CONTEXT AROUND FIRST ERROR"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then
            FIRST_LINE=$(
              grep -n \
                -E "fatal error:|error:|undefined reference|CMake Error|FAILED:|partition is too small|overflow" \
                "$FULL_LOG" \
                | head -n 1 \
                | cut -d: -f1
            )

            if [ -n "$FIRST_LINE" ]; then
              START=$((FIRST_LINE - 20))

              if [ "$START" -lt 1 ]; then
                START=1
              fi

              END=$((FIRST_LINE + 50))

              sed -n "${START},${END}p" "$FULL_LOG"
            else
              echo "NO COMPILER ERROR PATTERN FOUND"
            fi
          fi

          echo ""
          echo "=================================================="
          echo "LAST 200 LINES OF BUILD"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then
            tail -n 200 "$FULL_LOG"
          fi

          echo ""
          echo "=================================================="
          echo "GENERATED PARTITION INFORMATION"
          echo "=================================================="

          find \
            "$BUILD" \
            -iname "*partition*" \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo ""
          echo "=================================================="
          echo "GENERATED SDKCONFIG BLUETOOTH"
          echo "=================================================="

          if [ -f "$BUILD/sdkconfig" ]; then
            grep -n \
              -E "^CONFIG_(BT|NIMBLE|BLE|PARTITION)" \
              "$BUILD/sdkconfig" \
              || true
          else
            echo "sdkconfig belum ditemukan"
          fi

          echo ""
          echo "=================================================="
          echo "MODULEDEFS TARS CHECK"
          echo "=================================================="

          if [ -f "$BUILD/genhdr/moduledefs.collected" ]; then
            grep -n \
              -E "tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.collected" \
              || true
          else
            echo "moduledefs.collected belum dibuat"
          fi

          echo ""
          echo "=================================================="
          echo "FIRMWARE SIZE"
          echo "=================================================="

          if [ -f "$BUILD/firmware.bin" ]; then
            ls -lh "$BUILD/firmware.bin"
          fi

          if [ -f "$BUILD/micropython.bin" ]; then
            ls -lh "$BUILD/micropython.bin"
          fi

          echo ""
          echo "=================================================="
          echo "BUILD DIRECTORY STATUS"
          echo "=================================================="

          if [ -d "$BUILD" ]; then
            find \
              "$BUILD" \
              -maxdepth 2 \
              -type f \
              | head -n 100
          else
            echo "Build directory belum ada"
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-Build-Diagnostic
          path: |
            tars_build.log
            micropython/ports/esp32/build-TARS_ESP32_A2DP/log/
            micropython/ports/esp32/build-TARS_ESP32_A2DP/sdkconfig
          if-no-files-found: warn

      - name: Fail workflow if build failed
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "FINAL BUILD STATUS"
          echo "=================================================="

          echo "BUILD_EXIT_CODE=${BUILD_EXIT_CODE:-unknown}"

          if [ "${BUILD_EXIT_CODE:-1}" != "0" ]; then
            echo ""
            echo "TARS BUILD FAILED"
            echo ""
            echo "PERIKSA BAGIAN:"
            echo "FIRST BUILD ERRORS"
            echo "CONTEXT AROUND FIRST ERROR"
            echo "LAST 200 LINES OF BUILD"

            exit 1
          fi

          echo ""
          echo "TARS BUILD SUCCESS"

      - name: Verify TARS modules
        if: success()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          echo "=================================================="
          echo "CHECK FIRMWARE"
          echo "=================================================="

          ls -lh "$BUILD/firmware.bin"

          echo ""
          echo "=================================================="
          echo "MODULEDEFS.COLLECTED TARS"
          echo "=================================================="

          if [ -f "$BUILD/genhdr/moduledefs.collected" ]; then
            grep -n \
              -E "tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.collected" \
              || true
          fi

          echo ""
          echo "=================================================="
          echo "MODULEDEFS.H TARS"
          echo "=================================================="

          if [ -f "$BUILD/genhdr/moduledefs.h" ]; then
            grep -n \
              -E "TARS_A2DP|TARS_BLUETOOTH|tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.h" \
              || true
          fi

      - name: Prepare firmware
        if: success()
        shell: bash
        run: |
          mkdir -p output

          cp \
            "$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin" \
            "$GITHUB_WORKSPACE/output/TARS-MicroPython-ESP32-A2DP.bin"

          echo "=================================================="
          echo "OUTPUT FIRMWARE"
          echo "=================================================="

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-A2DP
          path: output/TARS-MicroPython-ESP32-A2DP.bin
          if-no-files-found: error
