name: Build TARS MicroPython ESP32 A2DP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout TARS repository
        uses: actions/checkout@v4


      # ==================================================
      # SYSTEM PACKAGES
      # ==================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0


      # ==================================================
      # MICROPYTHON
      # ==================================================

      - name: Clone MicroPython
        run: |
          git clone \
            --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython


      - name: Setup MicroPython submodules
        run: |
          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1


      # ==================================================
      # ESP-IDF
      # ==================================================

      - name: Clone ESP-IDF
        run: |
          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0


      - name: Install ESP-IDF
        run: |
          cd esp-idf

          ./install.sh esp32


      # ==================================================
      # MPY-CROSS
      # ==================================================

      - name: Build mpy-cross
        run: |
          cd micropython

          make -C mpy-cross


      # ==================================================
      # ESP32 SUBMODULES
      # ==================================================

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules


      # ==================================================
      # INSTALL CUSTOM BOARD
      # ==================================================

      - name: Install TARS custom board
        shell: bash
        run: |
          BOARD_DIR="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP"

          mkdir -p "$BOARD_DIR"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.h" \
            "$BOARD_DIR/mpconfigboard.h"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.cmake" \
            "$BOARD_DIR/mpconfigboard.cmake"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth" \
            "$BOARD_DIR/sdkconfig.bluetooth"

          echo "=================================================="
          echo "TARS CUSTOM BOARD FILES"
          echo "=================================================="

          ls -la "$BOARD_DIR"

          echo ""

          echo "=================================================="
          echo "SDKCONFIG BLUETOOTH"
          echo "=================================================="

          cat "$BOARD_DIR/sdkconfig.bluetooth"

          echo ""

          echo "=================================================="
          echo "MPCONFIGBOARD.H"
          echo "=================================================="

          cat "$BOARD_DIR/mpconfigboard.h"

          echo ""

          echo "=================================================="
          echo "MPCONFIGBOARD.CMAKE"
          echo "=================================================="

          cat "$BOARD_DIR/mpconfigboard.cmake"


      # ==================================================
      # CHECK USER MODULE FILES
      # ==================================================

      - name: Check TARS module files
        shell: bash
        run: |
          echo "=================================================="
          echo "MODULES DIRECTORY"
          echo "=================================================="

          find \
            "$GITHUB_WORKSPACE/modules" \
            -maxdepth 3 \
            -type f \
            -print

          echo ""

          echo "=================================================="
          echo "MASTER MICROPYTHON.CMAKE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/micropython.cmake" \
            || true

          echo ""

          echo "=================================================="
          echo "TARS A2DP SOURCE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/tars_a2dp/tars_a2dp.c" \
            || true

          echo ""

          echo "=================================================="
          echo "TARS A2DP CMAKE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/tars_a2dp/micropython.cmake" \
            || true

          echo ""

          echo "=================================================="
          echo "TARS BLUETOOTH SOURCE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/tars_bluetooth/tars_bluetooth.c" \
            || true

          echo ""

          echo "=================================================="
          echo "TARS BLUETOOTH CMAKE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/tars_bluetooth/micropython.cmake" \
            || true


      # ==================================================
      # BUILD
      # ==================================================

      - name: Build TARS MicroPython A2DP
        id: build_tars
        shell: bash
        continue-on-error: true
        run: |
          set +e

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf \
            ports/esp32/build-TARS_ESP32_A2DP

          make \
            -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/tars_build_full.log"

          BUILD_RESULT=${PIPESTATUS[0]}

          echo "BUILD_EXIT_CODE=$BUILD_RESULT" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "BUILD EXIT CODE: $BUILD_RESULT"
          echo "=================================================="

          exit 0


      # ==================================================
      # DIAGNOSE BUILD ERROR
      # ==================================================

      - name: Diagnose build error
        if: always()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          FULL_LOG="$GITHUB_WORKSPACE/tars_build_full.log"

          echo "=================================================="
          echo "BUILD RESULT"
          echo "=================================================="

          echo "BUILD_EXIT_CODE=${BUILD_EXIT_CODE:-unknown}"


          echo ""
          echo "=================================================="
          echo "FIRST BUILD ERRORS"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then

            grep -n -m 50 \
              -E "fatal error:|error:|undefined reference|CMake Error|FAILED:" \
              "$FULL_LOG" \
              || true

          else

            echo "FULL BUILD LOG NOT FOUND"

          fi


          echo ""
          echo "=================================================="
          echo "CONTEXT AROUND FIRST ERROR"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then

            FIRST_LINE=$(
              grep -n \
                -E "fatal error:|error:|undefined reference|CMake Error|FAILED:" \
                "$FULL_LOG" \
                | head -n 1 \
                | cut -d: -f1
            )

            if [ -n "$FIRST_LINE" ]; then

              START=$((FIRST_LINE - 30))

              if [ "$START" -lt 1 ]; then
                START=1
              fi

              END=$((FIRST_LINE + 80))

              sed -n "${START},${END}p" \
                "$FULL_LOG"

            else

              echo "NO COMPILER ERROR PATTERN FOUND"

            fi

          fi


          echo ""
          echo "=================================================="
          echo "LAST 200 LINES OF BUILD"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then

            tail -n 200 \
              "$FULL_LOG"

          fi


          echo ""
          echo "=================================================="
          echo "CUSTOM BOARD CONFIG"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth" \
            || true


          echo ""
          echo "=================================================="
          echo "GENERATED SDKCONFIG BLUETOOTH"
          echo "=================================================="

          if [ -f "$BUILD/sdkconfig" ]; then

            grep -n \
              -E "^CONFIG_(BT|NIMBLE|BLE)" \
              "$BUILD/sdkconfig" \
              || true

          else

            echo "sdkconfig belum ditemukan"

          fi


          echo ""
          echo "=================================================="
          echo "A2DP CONFIGURATION"
          echo "=================================================="

          if [ -f "$BUILD/sdkconfig" ]; then

            grep -n -i \
              -E "A2DP|AVRC|CLASSIC|BLUEDROID" \
              "$BUILD/sdkconfig" \
              || true

          else

            echo "sdkconfig belum ditemukan"

          fi


          echo ""
          echo "=================================================="
          echo "IMPORTANT BLUETOOTH OPTIONS"
          echo "=================================================="

          if [ -f "$BUILD/sdkconfig" ]; then

            grep -n \
              -E \
              "CONFIG_BT_ENABLED|CONFIG_BT_NIMBLE_ENABLED|CONFIG_BT_BLUEDROID_ENABLED|CONFIG_BT_CLASSIC_ENABLED|CONFIG_BT_BLE_ENABLED" \
              "$BUILD/sdkconfig" \
              || true

          fi


          echo ""
          echo "=================================================="
          echo "SEARCH esp_a2d_source_init"
          echo "=================================================="

          grep -R -n \
            "esp_a2d_source_init" \
            "$GITHUB_WORKSPACE/esp-idf/components/bt" \
            2>/dev/null \
            | head -n 100 \
            || true


          echo ""
          echo "=================================================="
          echo "SEARCH A2DP SOURCE IMPLEMENTATION"
          echo "=================================================="

          grep -R -n -i \
            -E "a2d_source|a2dp.*source|source.*a2dp" \
            "$GITHUB_WORKSPACE/esp-idf/components/bt" \
            2>/dev/null \
            | head -n 200 \
            || true


          echo ""
          echo "=================================================="
          echo "CHECK BLUEDROID LIBRARIES"
          echo "=================================================="

          find \
            "$BUILD" \
            -type f \
            \( -name "*.a" -o -name "*.obj" \) \
            2>/dev/null \
            | grep \
              -E "bt|bluetooth|bluedroid|a2dp" \
            | head -n 200 \
            || true


          echo ""
          echo "=================================================="
          echo "SEARCH SYMBOL IN STATIC LIBRARIES"
          echo "=================================================="

          find \
            "$BUILD" \
            -type f \
            -name "*.a" \
            2>/dev/null \
            | while read -r LIB; do

                if xtensa-esp32-elf-nm \
                  "$LIB" \
                  2>/dev/null \
                  | grep -q \
                    "esp_a2d_source_init"; then

                  echo ""
                  echo "FOUND IN:"
                  echo "$LIB"

                  xtensa-esp32-elf-nm \
                    "$LIB" \
                    2>/dev/null \
                    | grep \
                      "esp_a2d_source_init" \
                    || true

                fi

              done \
            || true


          echo ""
          echo "=================================================="
          echo "CHECK NIMBLE HEADERS"
          echo "=================================================="

          find \
            "$GITHUB_WORKSPACE/esp-idf/components" \
            -type f \
            \( \
              -name "ble_hs.h" \
              -o \
              -name "nimble_port.h" \
            \) \
            -print \
            || true


          echo ""
          echo "=================================================="
          echo "CHECK BLUEDROID HEADERS"
          echo "=================================================="

          find \
            "$GITHUB_WORKSPACE/esp-idf/components" \
            -type f \
            \( \
              -name "esp_bt_main.h" \
              -o \
              -name "esp_a2dp_api.h" \
            \) \
            -print \
            || true


          echo ""
          echo "=================================================="
          echo "MODULEDEFS.COLLECTED TARS"
          echo "=================================================="

          if [ -f "$BUILD/genhdr/moduledefs.collected" ]; then

            grep -n \
              -E "tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.collected" \
              || true

          else

            echo "moduledefs.collected belum dibuat"

          fi


          echo ""
          echo "=================================================="
          echo "MODULEDEFS.H TARS"
          echo "=================================================="

          if [ -f "$BUILD/genhdr/moduledefs.h" ]; then

            grep -n \
              -E \
              "MODULE_DEF_TARS_A2DP|MODULE_DEF_TARS_BLUETOOTH|tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.h" \
              || true

          else

            echo "moduledefs.h belum dibuat"

          fi


          echo ""
          echo "=================================================="
          echo "BUILD DIRECTORY STATUS"
          echo "=================================================="

          if [ -d "$BUILD" ]; then

            find \
              "$BUILD" \
              -maxdepth 2 \
              -type f \
              | head -n 150

          else

            echo "Build directory belum ada"

          fi


      # ==================================================
      # UPLOAD DIAGNOSTIC
      # ==================================================

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-Build-Diagnostic
          path: |
            tars_build_full.log
            micropython/ports/esp32/build-TARS_ESP32_A2DP/log/
            micropython/ports/esp32/build-TARS_ESP32_A2DP/sdkconfig
            micropython/ports/esp32/build-TARS_ESP32_A2DP/genhdr/
          if-no-files-found: warn


      # ==================================================
      # FINAL BUILD STATUS
      # ==================================================

      - name: Fail workflow if build failed
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "FINAL BUILD STATUS"
          echo "=================================================="

          echo "BUILD_EXIT_CODE=${BUILD_EXIT_CODE:-unknown}"

          if [ "${BUILD_EXIT_CODE:-1}" != "0" ]; then

            echo ""
            echo "TARS BUILD FAILED"
            echo ""
            echo "PERIKSA BAGIAN:"
            echo "FIRST BUILD ERRORS"
            echo "CONTEXT AROUND FIRST ERROR"
            echo "LAST 200 LINES OF BUILD"
            echo "SEARCH esp_a2d_source_init"
            echo "SEARCH SYMBOL IN STATIC LIBRARIES"

            exit 1

          fi

          echo ""
          echo "TARS BUILD SUCCESS"


      # ==================================================
      # VERIFY MODULES
      # ==================================================

      - name: Verify TARS modules
        if: success()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          echo "=================================================="
          echo "CHECK FIRMWARE"
          echo "=================================================="

          ls -lh \
            "$BUILD/firmware.bin"


          echo ""
          echo "=================================================="
          echo "MODULEDEFS.COLLECTED TARS"
          echo "=================================================="

          grep -n \
            -E "tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr/moduledefs.collected" \
            || true


          echo ""
          echo "=================================================="
          echo "MODULEDEFS.H TARS"
          echo "=================================================="

          grep -n \
            -E \
            "TARS_A2DP|TARS_BLUETOOTH|tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr/moduledefs.h" \
            || true


      # ==================================================
      # PREPARE FIRMWARE
      # ==================================================

      - name: Prepare firmware
        if: success()
        shell: bash
        run: |
          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          cp \
            "$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin" \
            "$GITHUB_WORKSPACE/output/TARS-MicroPython-ESP32-A2DP.bin"

          echo "=================================================="
          echo "OUTPUT FIRMWARE"
          echo "=================================================="

          ls -lh \
            "$GITHUB_WORKSPACE/output"


      # ==================================================
      # UPLOAD FIRMWARE
      # ==================================================

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-A2DP
          path: |
            output/TARS-MicroPython-ESP32-A2DP.bin
          if-no-files-found: error
