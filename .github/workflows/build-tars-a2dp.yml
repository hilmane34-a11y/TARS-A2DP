name: Build TARS ESP32 A2DP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =====================================================
      # CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout TARS repository
        uses: actions/checkout@v4


      # =====================================================
      # INSTALL SYSTEM PACKAGES
      # =====================================================

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0


      # =====================================================
      # CLONE MICROPYTHON
      # =====================================================

      - name: Clone MicroPython
        run: |
          git clone --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython


      - name: Setup MicroPython submodules
        run: |
          cd micropython
          git submodule update \
            --init \
            --recursive \
            --depth 1


      # =====================================================
      # CLONE ESP-IDF
      # =====================================================

      - name: Clone ESP-IDF v5.5.5
        run: |
          git clone --depth 1 \
            --branch v5.5.5 \
            https://github.com/espressif/esp-idf.git \
            esp-idf


      - name: Setup ESP-IDF submodules
        run: |
          cd esp-idf
          git submodule update \
            --init \
            --recursive \
            --filter=tree:0


      # =====================================================
      # INSTALL ESP-IDF
      # =====================================================

      - name: Install ESP-IDF
        run: |
          cd esp-idf
          ./install.sh esp32


      # =====================================================
      # BUILD MPY-CROSS
      # =====================================================

      - name: Build mpy-cross
        run: |
          cd micropython
          make -C mpy-cross


      # =====================================================
      # SETUP ESP32 SUBMODULES
      # =====================================================

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules


      # =====================================================
      # CHECK TARS MODULE
      # =====================================================

      - name: Check TARS module files
        run: |
          echo "===== modules/micropython.cmake ====="
          cat modules/micropython.cmake

          echo ""
          echo "===== modules/tars_a2dp/micropython.cmake ====="
          cat modules/tars_a2dp/micropython.cmake

          echo ""
          echo "===== MODULE REGISTRATION ====="
          grep -n "MP_REGISTER_MODULE" \
            modules/tars_a2dp/tars_a2dp.c


      # =====================================================
      # CREATE CUSTOM BOARD
      # =====================================================

      - name: Create TARS A2DP board
        run: |
          rm -rf \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP

          cp -a \
            micropython/ports/esp32/boards/ESP32_GENERIC \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP


      # =====================================================
      # CREATE A2DP SDKCONFIG
      # =====================================================

      - name: Create A2DP configuration
        run: |
          cat > \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/sdkconfig.a2dp \
            <<'EOF'
          CONFIG_BT_ENABLED=y
          CONFIG_BT_BLUEDROID_ENABLED=y
          CONFIG_BT_NIMBLE_ENABLED=n
          CONFIG_BT_CLASSIC_ENABLED=y
          CONFIG_BT_A2DP_ENABLE=y
          CONFIG_BT_SPP_ENABLED=y
          EOF


      # =====================================================
      # CONFIGURE CUSTOM BOARD
      # =====================================================

      - name: Configure TARS board
        run: |
          cat > \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/mpconfigboard.cmake \
            <<'EOF'
          set(SDKCONFIG_DEFAULTS
              boards/sdkconfig.base
              ${MICROPY_BOARD_DIR}/sdkconfig.a2dp
          )
          EOF


      # =====================================================
      # DISABLE MICROPYTHON NIMBLE
      # =====================================================

      - name: Disable MicroPython NimBLE
        run: |
          cat >> \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/mpconfigboard.h \
            <<'EOF'

          #undef MICROPY_PY_BLUETOOTH
          #define MICROPY_PY_BLUETOOTH (0)

          #undef MICROPY_PY_BLUETOOTH_NIMBLE
          #define MICROPY_PY_BLUETOOTH_NIMBLE (0)

          #undef MICROPY_PY_BLUETOOTH_LE
          #define MICROPY_PY_BLUETOOTH_LE (0)

          EOF


      # =====================================================
      # SHOW BOARD CONFIG
      # =====================================================

      - name: Show TARS board configuration
        run: |
          echo "===== mpconfigboard.cmake ====="
          cat \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/mpconfigboard.cmake

          echo ""
          echo "===== sdkconfig.a2dp ====="
          cat \
            micropython/ports/esp32/boards/TARS_ESP32_A2DP/sdkconfig.a2dp


      # =====================================================
      # CLEAN OLD BUILD
      # =====================================================

      - name: Clean old build
        run: |
          rm -rf \
            micropython/ports/esp32/build-TARS_ESP32_A2DP


      # =====================================================
      # BUILD TARS MICROPYTHON
      # =====================================================

      - name: Build TARS MicroPython A2DP
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake"


      # =====================================================
      # VERIFY TARS SOURCE WAS COMPILED
      # =====================================================

      - name: Verify TARS A2DP source
        run: |
          echo "===== SEARCHING TARS OBJECT ====="

          find \
            micropython/ports/esp32/build-TARS_ESP32_A2DP \
            -type f \
            \( -name "*tars_a2dp*.obj" -o -name "*tars_a2dp*.o" \) \
            -print


      # =====================================================
      # VERIFY FIRMWARE
      # =====================================================

      - name: Verify firmware output
        run: |
          test -f \
            micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin

          test -f \
            micropython/ports/esp32/build-TARS_ESP32_A2DP/micropython.elf

          echo "===== FIRMWARE ====="

          ls -lh \
            micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin

          echo ""
          echo "===== ELF ====="

          ls -lh \
            micropython/ports/esp32/build-TARS_ESP32_A2DP/micropython.elf


      # =====================================================
      # PREPARE FIRMWARE
      # =====================================================

      - name: Prepare firmware
        run: |
          mkdir -p output

          cp \
            micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin \
            output/TARS-MicroPython-ESP32-A2DP.bin


      # =====================================================
      # UPLOAD ARTIFACT
      # =====================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-A2DP
          path: output/TARS-MicroPython-ESP32-A2DP.bin
          if-no-files-found: error
