name: Build Utama TARS V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout TARS repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. CHECK TARS MODULE STRUCTURE
      # =====================================================

      - name: Check TARS module structure
        run: |
          echo "=================================================="
          echo "TARS MODULE STRUCTURE"
          echo "=================================================="

          find modules -type f | sort

          echo ""
          echo "=================================================="
          echo "modules/micropython.cmake"
          echo "=================================================="

          cat modules/micropython.cmake

          echo ""
          echo "=================================================="
          echo "modules/tars_a2dp/tars_a2dp.c"
          echo "=================================================="

          cat modules/tars_a2dp/tars_a2dp.c

          echo ""
          echo "=================================================="
          echo "modules/tars_bluetooth/tars_bluetooth.c"
          echo "=================================================="

          cat modules/tars_bluetooth/tars_bluetooth.c


      # =====================================================
      # 3. VERIFY REQUIRED TARS FILES
      # =====================================================

      - name: Verify TARS files
        run: |
          set -e

          test -f modules/micropython.cmake
          test -f modules/tars_a2dp/tars_a2dp.c
          test -f modules/tars_bluetooth/tars_bluetooth.c

          echo ""
          echo "ALL REQUIRED TARS MODULE FILES FOUND"


      # =====================================================
      # 4. INSTALL SYSTEM PACKAGES
      # =====================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0 \
            binutils


      # =====================================================
      # 5. CLONE MICROPYTHON
      # =====================================================

      - name: Clone MicroPython
        run: |
          git clone \
            --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython


      # =====================================================
      # 6. SETUP MICROPYTHON SUBMODULES
      # =====================================================

      - name: Setup MicroPython submodules
        run: |
          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1


      # =====================================================
      # 7. CHECK MP_REGISTER_MODULE DEFINITION
      # =====================================================

      - name: Check MP_REGISTER_MODULE definition
        run: |
          echo "=================================================="
          echo "SEARCH MP_REGISTER_MODULE DEFINITION"
          echo "=================================================="

          grep -R -n \
            -A 12 \
            -B 3 \
            "define MP_REGISTER_MODULE" \
            micropython/py \
            || true

          echo ""
          echo "=================================================="
          echo "SEARCH MODULE REGISTRATION SUPPORT"
          echo "=================================================="

          grep -R -n \
            -E "MP_REGISTER_MODULE|MP_REGISTER_EXTENSIBLE_MODULE" \
            micropython/py \
            || true


      # =====================================================
      # 8. CLONE ESP-IDF
      # =====================================================

      - name: Clone ESP-IDF
        run: |
          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf


      # =====================================================
      # 9. SETUP ESP-IDF SUBMODULES
      # =====================================================

      - name: Setup ESP-IDF submodules
        run: |
          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0


      # =====================================================
      # 10. INSTALL ESP-IDF
      # =====================================================

      - name: Install ESP-IDF
        run: |
          cd esp-idf

          ./install.sh esp32


      # =====================================================
      # 11. BUILD MPY-CROSS
      # =====================================================

      - name: Build mpy-cross
        run: |
          cd micropython

          make -C mpy-cross


      # =====================================================
      # 12. SETUP ESP32 SUBMODULES
      # =====================================================

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules


      # =====================================================
      # 13. BUILD TARS MICROPYTHON
      # =====================================================

      - name: Build TARS MicroPython
        shell: bash
        run: |
          set -o pipefail

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf ports/esp32/build-ESP32_GENERIC

          make -C ports/esp32 \
            BOARD=ESP32_GENERIC \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            V=1 \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"


      # =====================================================
      # 14. VERIFY TARS SOURCE OBJECTS
      # =====================================================

      - name: Verify TARS source objects
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC"

          echo "=================================================="
          echo "A2DP OBJECT FILES"
          echo "=================================================="

          find "$BUILD" \
            -type f \
            \( \
              -name "*tars_a2dp*.obj" \
              -o \
              -name "*tars_a2dp*.o" \
            \) \
            -print

          echo ""
          echo "=================================================="
          echo "BLUETOOTH OBJECT FILES"
          echo "=================================================="

          find "$BUILD" \
            -type f \
            \( \
              -name "*tars_bluetooth*.obj" \
              -o \
              -name "*tars_bluetooth*.o" \
            \) \
            -print


      # =====================================================
      # 15. VERIFY QSTR REGISTRATION
      # =====================================================

      - name: Verify TARS QSTR registration
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC"

          echo "=================================================="
          echo "QSTR REFERENCES"
          echo "=================================================="

          grep -R \
            -E "tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr" \
            2>/dev/null \
            || true

          echo ""
          echo "=================================================="
          echo "GENERATED QSTR DEFINITIONS"
          echo "=================================================="

          grep -E \
            "QDEF.*tars_a2dp|QDEF.*tars_bluetooth" \
            "$BUILD/genhdr/qstrdefs.generated.h" \
            2>/dev/null \
            || true


      # =====================================================
      # 16. VERIFY ELF EXISTS
      # =====================================================

      - name: Verify ELF exists
        run: |
          ELF="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC/micropython.elf"

          echo "=================================================="
          echo "ELF FILE"
          echo "=================================================="

          test -f "$ELF"

          ls -lh "$ELF"


      # =====================================================
      # 17. VERIFY TARS SYMBOLS IN ELF
      # =====================================================

      - name: Verify TARS symbols in ELF
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          ELF="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC/micropython.elf"

          echo "=================================================="
          echo "ALL TARS SYMBOLS"
          echo "=================================================="

          xtensa-esp32-elf-nm -a "$ELF" \
            | grep -i \
              -E "tars_a2dp|tars_bluetooth" \
            || true

          echo ""
          echo "=================================================="
          echo "A2DP MODULE SYMBOL"
          echo "=================================================="

          xtensa-esp32-elf-nm -a "$ELF" \
            | grep \
              "tars_a2dp_user_cmodule" \
            || true

          echo ""
          echo "=================================================="
          echo "BLUETOOTH MODULE SYMBOL"
          echo "=================================================="

          xtensa-esp32-elf-nm -a "$ELF" \
            | grep \
              "tars_bluetooth_user_cmodule" \
            || true


      # =====================================================
      # 18. VERIFY MODULE NAMES IN ELF
      # =====================================================

      - name: Verify TARS module names in ELF
        run: |
          ELF="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC/micropython.elf"

          echo "=================================================="
          echo "TARS MODULE NAMES IN ELF"
          echo "=================================================="

          strings "$ELF" \
            | grep -E \
              "^tars_a2dp$|^tars_bluetooth$" \
            || true


      # =====================================================
      # 19. VERIFY MP_REGISTER_MODULE IN SOURCE
      # =====================================================

      - name: Verify MP_REGISTER_MODULE source
        run: |
          echo "=================================================="
          echo "A2DP REGISTRATION"
          echo "=================================================="

          grep -A4 -B2 \
            "MP_REGISTER_MODULE" \
            modules/tars_a2dp/tars_a2dp.c

          echo ""
          echo "=================================================="
          echo "BLUETOOTH REGISTRATION"
          echo "=================================================="

          grep -A4 -B2 \
            "MP_REGISTER_MODULE" \
            modules/tars_bluetooth/tars_bluetooth.c


      # =====================================================
      # 20. PREPARE FIRMWARE
      # =====================================================

      - name: Prepare firmware
        run: |
          set -e

          mkdir -p output

          test -f \
            micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin

          cp \
            micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin \
            output/TARS-MicroPython-ESP32-UTAMA-V1.bin

          echo ""
          echo "=================================================="
          echo "FIRMWARE"
          echo "=================================================="

          ls -lh \
            output/TARS-MicroPython-ESP32-UTAMA-V1.bin


      # =====================================================
      # 21. UPLOAD FIRMWARE
      # =====================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:
          name: TARS-MicroPython-ESP32-UTAMA-V1
          path: output/TARS-MicroPython-ESP32-UTAMA-V1.bin
          if-no-files-found: error
