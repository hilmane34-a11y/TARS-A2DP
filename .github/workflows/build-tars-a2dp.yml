name: Build TARS MicroPython ESP32 A2DP MP3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc g++ cmake ninja-build \
            python3 python3-pip \
            flex bison gperf ccache \
            libffi-dev libssl-dev \
            dfu-util libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython

          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1

      - name: Clone ESP-IDF
        run: |
          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0

      - name: Install ESP-IDF
        run: |
          cd esp-idf
          ./install.sh esp32

      - name: Build mpy-cross
        run: |
          cd micropython
          make -C mpy-cross

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules

      - name: Install ESP Audio Codec MP3
        shell: bash
        run: |
          set -e

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          COMPONENT_DIR="$GITHUB_WORKSPACE/esp-idf/components/esp_audio_codec"

          echo "========================================"
          echo "INSTALL ESP AUDIO CODEC 2.6.2"
          echo "========================================"

          rm -rf "$COMPONENT_DIR"

          mkdir -p "$COMPONENT_DIR"

          python3 -m pip install --upgrade \
            idf-component-manager

          cd "$GITHUB_WORKSPACE/esp-idf/components"

          cat > esp_audio_codec/idf_component.yml << 'EOF'
          dependencies:
            espressif/esp_audio_codec:
              version: "2.6.2"
          EOF

          echo ""
          echo "MANIFEST:"
          cat "$COMPONENT_DIR/idf_component.yml"

          echo ""
          echo "DOWNLOAD ESP AUDIO CODEC"

          cd "$GITHUB_WORKSPACE/esp-idf"

          python3 -m idf_component_manager \
            --help || true

          echo ""
          echo "TRY COMPONENT DOWNLOAD"

          compote component download \
            espressif/esp_audio_codec \
            --version 2.6.2 \
            --path "$COMPONENT_DIR"

      - name: Verify ESP Audio Codec
        shell: bash
        run: |
          set -e

          CODEC="$GITHUB_WORKSPACE/esp-idf/components/esp_audio_codec"

          echo "========================================"
          echo "VERIFY ESP AUDIO CODEC"
          echo "========================================"

          if [ ! -d "$CODEC" ]; then
            echo "ERROR: esp_audio_codec DIRECTORY NOT FOUND"
            exit 1
          fi

          echo ""
          echo "CODEC DIRECTORY:"
          ls -la "$CODEC"

          echo ""
          echo "MP3 / AUDIO HEADERS:"

          find "$CODEC" \
            -type f \
            \( \
              -name "esp_audio_dec_default.h" \
              -o \
              -name "esp_audio_simple_dec.h" \
              -o \
              -name "esp_audio_simple_dec_default.h" \
            \) \
            -print

          echo ""
          echo "MP3 SOURCE FILES:"

          find "$CODEC" \
            -type f \
            -iname "*mp3*" \
            | head -n 100

          echo ""
          echo "CMAKE:"

          if [ -f "$CODEC/CMakeLists.txt" ]; then
            cat "$CODEC/CMakeLists.txt"
          else
            echo "ERROR: CMakeLists.txt NOT FOUND"
            exit 1
          fi

      - name: Apply esp32_rmt.c fix
        shell: bash
        run: |
          RMT_FILE="$GITHUB_WORKSPACE/micropython/ports/esp32/esp32_rmt.c"

          echo "========================================"
          echo "PATCH ESP32 RMT"
          echo "========================================"

          if [ ! -f "$RMT_FILE" ]; then
            echo "ERROR: esp32_rmt.c NOT FOUND"
            exit 1
          fi

          echo "BEFORE PATCH:"
          grep -n "resolution_hz" "$RMT_FILE" || true

          if grep -q "mp_uint_t resolution_hz = 1000000;" "$RMT_FILE"; then
            echo "RMT ALREADY PATCHED"

          elif grep -q "mp_uint_t resolution_hz;" "$RMT_FILE"; then
            sed -i \
              's/mp_uint_t resolution_hz;/mp_uint_t resolution_hz = 1000000;/' \
              "$RMT_FILE"

          else
            echo "ERROR: EXPECTED resolution_hz DECLARATION NOT FOUND"
            grep -n "resolution_hz" "$RMT_FILE" || true
            exit 1
          fi

          echo ""
          echo "AFTER PATCH:"
          grep -n "resolution_hz" "$RMT_FILE" || true

          if grep -q \
            "mp_uint_t resolution_hz = 1000000;" \
            "$RMT_FILE"; then

            echo "PATCH SUCCESS"

          else

            echo "ERROR: RMT PATCH FAILED"
            exit 1

          fi

      - name: Install TARS board
        shell: bash
        run: |
          BOARD_DIR="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP"

          mkdir -p "$BOARD_DIR"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.h" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.cmake" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/partitions.csv" \
            "$BOARD_DIR/"

          echo "========================================"
          echo "TARS BOARD INSTALLED"
          echo "========================================"

          ls -la "$BOARD_DIR"

      - name: Enable HTTPS Certificate Bundle
        shell: bash
        run: |
          BOARD="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth"

          sed -i '/CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=/d' "$BOARD"
          sed -i '/CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=/d' "$BOARD"
          sed -i '/CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=/d' "$BOARD"
          sed -i '/CONFIG_ESP_TLS_USE_SECURE_ELEMENT=/d' "$BOARD"

          cat >> "$BOARD" << 'EOF'
          CONFIG_MBEDTLS_SSL_ALPN=y
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=n
          CONFIG_ESP_TLS_USE_SECURE_ELEMENT=n
          EOF

          echo "HTTPS CONFIG ADDED"

      - name: Patch requests HTTPS backend to ssl
        shell: bash
        run: |
          REQ="$GITHUB_WORKSPACE/micropython/lib/micropython-lib/python-ecosys/requests/requests/__init__.py"

          if [ ! -f "$REQ" ]; then
            echo "ERROR: REQUESTS FILE NOT FOUND"
            exit 1
          fi

          sed -i -E \
            's/^([[:space:]]*)import[[:space:]]+tls[[:space:]]*$/\1import ssl as tls/' \
            "$REQ"

          if grep -q -E \
            "^[[:space:]]*import[[:space:]]+ssl[[:space:]]+as[[:space:]]+tls" \
            "$REQ"; then

            echo "REQUESTS SSL PATCH SUCCESS"

          else

            echo "ERROR: REQUESTS SSL PATCH FAILED"
            exit 1

          fi

      - name: Patch A2DP queue
        shell: bash
        run: |
          A2DP_FILE="$GITHUB_WORKSPACE/esp-idf/components/bt/host/bluedroid/btc/profile/std/a2dp/btc_a2dp_source.c"

          echo "========================================"
          echo "PATCH A2DP QUEUE"
          echo "========================================"

          if [ ! -f "$A2DP_FILE" ]; then
            echo "ERROR: A2DP FILE NOT FOUND"
            exit 1
          fi

          sed -i \
            's/#define MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ     (27)/#define MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ     (16)/' \
            "$A2DP_FILE"

          grep -n \
            "MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ" \
            "$A2DP_FILE" || true

      - name: Verify TARS MP3 module
        shell: bash
        run: |
          set -e

          CMAKE_FILE="$GITHUB_WORKSPACE/modules/tars_a2dp/micropython.cmake"
          SOURCE_FILE="$GITHUB_WORKSPACE/modules/tars_a2dp/tars_a2dp.c"

          echo "========================================"
          echo "VERIFY TARS MP3 MODULE"
          echo "========================================"

          if [ ! -f "$CMAKE_FILE" ]; then
            echo "ERROR: micropython.cmake NOT FOUND"
            exit 1
          fi

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "ERROR: tars_a2dp.c NOT FOUND"
            exit 1
          fi

          echo ""
          echo "----- CMAKE -----"
          cat "$CMAKE_FILE"

          echo ""
          echo "----- MP3 REFERENCES -----"

          grep -n \
            -E "esp_audio|SIMPLE_DEC|MP3" \
            "$SOURCE_FILE" \
            | head -n 100 \
            || true

          echo ""
          echo "----- CHECK LINK -----"

          if grep -q \
            "__idf_esp_audio_codec" \
            "$CMAKE_FILE"; then

            echo "ESP AUDIO CODEC LINK FOUND"

          else

            echo "ERROR: ESP AUDIO CODEC LINK NOT FOUND"
            exit 1

          fi

      - name: Build TARS firmware
        shell: bash
        run: |
          set -o pipefail

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf \
            ports/esp32/build-TARS_ESP32_A2DP

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/tars_build.log"

      - name: Diagnose build
        if: always()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          echo "========================================"
          echo "TARS BUILD DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "----- AUDIO CODEC -----"

          find \
            "$GITHUB_WORKSPACE/esp-idf/components/esp_audio_codec" \
            -type f \
            | head -n 100 \
            || true

          echo ""
          echo "----- MODULES -----"

          if [ -f "$BUILD/genhdr/moduledefs.collected" ]; then
            grep -n \
              -E "tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.collected" \
              || true
          fi

          echo ""
          echo "----- SDKCONFIG AUDIO / BT -----"

          if [ -f "$BUILD/sdkconfig" ]; then
            grep -n \
              -E "^(CONFIG_BT|CONFIG_A2DP|CONFIG_ESP_AUDIO)" \
              "$BUILD/sdkconfig" \
              || true
          fi

          echo ""
          echo "----- FIRMWARE -----"

          if [ -f "$BUILD/firmware.bin" ]; then
            ls -lh "$BUILD/firmware.bin"
          else
            echo "FIRMWARE NOT FOUND"
          fi

          echo ""
          echo "----- LAST BUILD LOG -----"

          tail -n 150 \
            "$GITHUB_WORKSPACE/tars_build.log" \
            || true

      - name: Prepare firmware
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          if [ ! -f "$BUILD/firmware.bin" ]; then
            echo "ERROR: FIRMWARE.BIN NOT FOUND"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            "$BUILD/firmware.bin" \
            "$GITHUB_WORKSPACE/output/TARS-MicroPython-ESP32-A2DP-MP3.bin"

          ls -lh \
            "$GITHUB_WORKSPACE/output"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-A2DP-MP3
          path: output/TARS-MicroPython-ESP32-A2DP-MP3.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-Build-Log
          path: tars_build.log
          if-no-files-found: warn
