name: Build TARS RAM LOW ESP32 A2DP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0

      - name: Clone MicroPython
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython

          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1

      - name: Clone ESP-IDF
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0

      - name: Install ESP-IDF
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/esp-idf"

          ./install.sh esp32

      - name: Verify ESP-IDF environment
        shell: bash
        run: |
          set -e

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          echo "========================================"
          echo "ESP-IDF VERSION"
          echo "========================================"

          idf.py --version

          echo ""
          echo "========================================"
          echo "COMPONENT MANAGER"
          echo "========================================"

          python3 -m pip show idf-component-manager || true

      - name: Build mpy-cross
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/micropython"

          make -C mpy-cross

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          set -e

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules

      - name: Apply esp32_rmt.c fix
        shell: bash
        run: |
          set -e

          RMT_FILE="$GITHUB_WORKSPACE/micropython/ports/esp32/esp32_rmt.c"

          if grep -q \
            "mp_uint_t resolution_hz = 1000000;" \
            "$RMT_FILE"; then

            echo "RMT FIX ALREADY APPLIED"

          elif grep -q \
            "mp_uint_t resolution_hz;" \
            "$RMT_FILE"; then

            sed -i \
              's/mp_uint_t resolution_hz;/mp_uint_t resolution_hz = 1000000;/' \
              "$RMT_FILE"

            echo "RMT FIX APPLIED"

          else

            echo "ERROR: resolution_hz NOT FOUND"
            exit 1

          fi

      - name: Install TARS board
        shell: bash
        run: |
          set -e

          SRC="$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP"
          DST="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP"

          mkdir -p "$DST"

          cp "$SRC/mpconfigboard.h" \
            "$DST/mpconfigboard.h"

          cp "$SRC/mpconfigboard.cmake" \
            "$DST/mpconfigboard.cmake"

          cp "$SRC/sdkconfig.bluetooth" \
            "$DST/sdkconfig.bluetooth"

          cp "$SRC/partitions.csv" \
            "$DST/partitions.csv"

          echo "========================================"
          echo "TARS BOARD"
          echo "========================================"

          ls -la "$DST"

      - name: Prepare TARS RAM LOW config
        shell: bash
        run: |
          set -e

          BOARD="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth"

          echo "========================================"
          echo "TARS RAM LOW CONFIG"
          echo "========================================"

          # Jangan menggunakan WiFi IRAM optimization.
          # RAM menjadi prioritas utama.

          sed -i \
            '/^CONFIG_ESP_WIFI_IRAM_OPT=/d' \
            "$BOARD"

          sed -i \
            '/^CONFIG_ESP_WIFI_RX_IRAM_OPT=/d' \
            "$BOARD"

          sed -i \
            '/^CONFIG_ESP_WIFI_EXTRA_IRAM_OPT=/d' \
            "$BOARD"

          echo "WiFi IRAM optimization entries removed."

          echo ""
          echo "Current WiFi IRAM settings:"
          grep -n \
            -E "CONFIG_ESP_WIFI_(IRAM_OPT|RX_IRAM_OPT|EXTRA_IRAM_OPT)" \
            "$BOARD" || true

      - name: Install ESP Audio Codec MP3
        shell: bash
        run: |
          set -e

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          FETCH="$GITHUB_WORKSPACE/audio-codec-fetch"
          DEST="$GITHUB_WORKSPACE/esp-idf/components/esp_audio_codec"

          rm -rf "$FETCH"
          rm -rf "$DEST"

          mkdir -p "$FETCH/main"

          cat > "$FETCH/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16)

          include($ENV{IDF_PATH}/tools/cmake/project.cmake)

          project(audio_codec_fetch)
          EOF

          cat > "$FETCH/main/CMakeLists.txt" <<'EOF'
          idf_component_register(
              SRCS "dummy.c"
          )
          EOF

          cat > "$FETCH/main/dummy.c" <<'EOF'
          void audio_codec_dummy(void)
          {
          }
          EOF

          cd "$FETCH"

          echo "========================================"
          echo "INSTALL ESP AUDIO CODEC 2.6.2"
          echo "========================================"

          # PENTING:
          # Jangan menjalankan:
          # pip install -U idf-component-manager
          #
          # Gunakan component manager bawaan ESP-IDF 5.5.2.

          idf.py add-dependency \
            "espressif/esp_audio_codec^2.6.2"

          idf.py reconfigure

          CODEC="$FETCH/managed_components/espressif__esp_audio_codec"

          if [ ! -d "$CODEC" ]; then
            echo "ERROR: ESP AUDIO CODEC NOT RESOLVED"
            echo ""
            echo "Searching managed components:"
            find "$FETCH" \
              -maxdepth 5 \
              -type d \
              -print
            exit 1
          fi

          HEADER="$CODEC/include/simple_dec/esp_audio_simple_dec.h"

          if [ ! -f "$HEADER" ]; then
            echo "ERROR: MP3 DECODER HEADER NOT FOUND"
            echo ""
            echo "Searching codec headers:"

            find "$CODEC" \
              -type f \
              \( \
                -name "esp_audio_simple_dec.h" \
                -o \
                -name "esp_audio_dec.h" \
              \) \
              -print

            exit 1
          fi

          mkdir -p "$DEST"

          cp -a "$CODEC"/. "$DEST"/

          if [ ! -f \
            "$DEST/include/simple_dec/esp_audio_simple_dec.h" ]; then

            echo "ERROR: CODEC COPY FAILED"
            exit 1

          fi

          echo ""
          echo "========================================"
          echo "ESP AUDIO CODEC 2.6.2 OK"
          echo "========================================"

          echo "Component:"
          echo "$DEST"

          echo ""
          echo "MP3 header:"
          echo "$DEST/include/simple_dec/esp_audio_simple_dec.h"

      - name: Verify MP3 CMake
        shell: bash
        run: |
          set -e

          CMAKE_FILE="$GITHUB_WORKSPACE/modules/tars_a2dp/micropython.cmake"

          if ! grep -q \
            "__idf_esp_audio_codec" \
            "$CMAKE_FILE"; then

            echo "ERROR: ESP AUDIO CODEC LINK MISSING"
            exit 1

          fi

          echo "MP3 CMAKE LINK OK"

      - name: Enable HTTPS certificate bundle
        shell: bash
        run: |
          set -e

          BOARD="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth"

          sed -i \
            '/^CONFIG_MBEDTLS_SSL_ALPN=/d' \
            "$BOARD"

          sed -i \
            '/^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=/d' \
            "$BOARD"

          sed -i \
            '/^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=/d' \
            "$BOARD"

          sed -i \
            '/^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=/d' \
            "$BOARD"

          sed -i \
            '/^CONFIG_ESP_TLS_USE_SECURE_ELEMENT=/d' \
            "$BOARD"

          cat >> "$BOARD" <<'EOF'
          CONFIG_MBEDTLS_SSL_ALPN=y
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=n
          CONFIG_ESP_TLS_USE_SECURE_ELEMENT=n
          EOF

      - name: Patch requests HTTPS
        shell: bash
        run: |
          set -e

          REQ="$GITHUB_WORKSPACE/micropython/lib/micropython-lib/python-ecosys/requests/requests/__init__.py"

          if [ -f "$REQ" ]; then

            sed -i -E \
              's/^([[:space:]]*)import[[:space:]]+tls[[:space:]]*$/\1import ssl as tls/' \
              "$REQ"

            echo "REQUESTS HTTPS PATCH OK"

          else

            echo "REQUESTS FILE NOT FOUND"

          fi

      - name: Patch A2DP queue RAM LOW
        shell: bash
        run: |
          set -e

          A2DP_FILE="$GITHUB_WORKSPACE/esp-idf/components/bt/host/bluedroid/btc/profile/std/a2dp/btc_a2dp_source.c"

          if [ ! -f "$A2DP_FILE" ]; then
            echo "ERROR: A2DP FILE NOT FOUND"
            exit 1
          fi

          sed -i \
            -E \
            's/#define[[:space:]]+MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ[[:space:]]+\(27\)/#define MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ     (16)/' \
            "$A2DP_FILE"

          echo "========================================"
          echo "A2DP RAM LOW"
          echo "========================================"

          grep \
            "MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ" \
            "$A2DP_FILE"

      - name: Build TARS firmware
        shell: bash
        run: |
          set -o pipefail

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf \
            ports/esp32/build-TARS_ESP32_A2DP

          echo "========================================"
          echo "BUILD TARS RAM LOW"
          echo "========================================"

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/tars_build.log"

      - name: Diagnose build
        if: always()
        shell: bash
        run: |
          set +e

          CODEC="$GITHUB_WORKSPACE/esp-idf/components/esp_audio_codec"
          PORTS="$GITHUB_WORKSPACE/micropython/ports/esp32"

          echo "========================================"
          echo "TARS RAM LOW DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "========================================"
          echo "ESP AUDIO CODEC"
          echo "========================================"

          if [ -d "$CODEC" ]; then
            echo "ESP AUDIO CODEC: OK"
          else
            echo "ESP AUDIO CODEC: MISSING"
          fi

          echo ""
          echo "========================================"
          echo "MP3 HEADER"
          echo "========================================"

          if [ -f \
            "$CODEC/include/simple_dec/esp_audio_simple_dec.h" ]; then

            echo "MP3 HEADER: OK"

          else

            echo "MP3 HEADER: MISSING"

          fi

          echo ""
          echo "========================================"
          echo "BUILD DIRECTORY"
          echo "========================================"

          BUILD=""

          if [ -d "$PORTS/build-TARS_ESP32_A2DP" ]; then
            BUILD="$PORTS/build-TARS_ESP32_A2DP"
          fi

          if [ -z "$BUILD" ]; then
            BUILD=$(find "$PORTS" \
              -maxdepth 3 \
              -type f \
              -name "firmware.bin" \
              -printf '%h\n' \
              2>/dev/null | head -n 1)
          fi

          if [ -n "$BUILD" ]; then
            echo "BUILD DIRECTORY:"
            echo "$BUILD"
          else
            echo "NO BUILD DIRECTORY CREATED"
          fi

          echo ""
          echo "========================================"
          echo "WIFI IRAM"
          echo "========================================"

          if [ -n "$BUILD" ] && \
             [ -f "$BUILD/sdkconfig" ]; then

            grep -n \
              -E "CONFIG_ESP_WIFI_(IRAM_OPT|RX_IRAM_OPT|EXTRA_IRAM_OPT)" \
              "$BUILD/sdkconfig" || true

          else

            echo "SDKCONFIG NOT FOUND"

          fi

          echo ""
          echo "========================================"
          echo "FIRMWARE"
          echo "========================================"

          if [ -n "$BUILD" ] && \
             [ -f "$BUILD/firmware.bin" ]; then

            ls -lh "$BUILD/firmware.bin"

            xxd -l 16 "$BUILD/firmware.bin"

          else

            echo "FIRMWARE NOT FOUND"

          fi

          echo ""
          echo "========================================"
          echo "BUILD LOG"
          echo "========================================"

          if [ -f "$GITHUB_WORKSPACE/tars_build.log" ]; then

            tail -n 300 \
              "$GITHUB_WORKSPACE/tars_build.log"

          else

            echo "BUILD LOG NOT FOUND"

          fi

      - name: Prepare firmware
        shell: bash
        run: |
          set -e

          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          if [ ! -f "$BUILD/firmware.bin" ]; then

            echo "ERROR: firmware.bin NOT FOUND"
            echo ""
            echo "The build step failed before firmware creation."
            exit 1

          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          cp \
            "$BUILD/firmware.bin" \
            "$GITHUB_WORKSPACE/output/TARS-MicroPython-ESP32-A2DP.bin"

          ls -lh \
            "$GITHUB_WORKSPACE/output/TARS-MicroPython-ESP32-A2DP.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:
          name: TARS-MicroPython-ESP32-A2DP
          path: output/TARS-MicroPython-ESP32-A2DP.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: TARS-Build-Log
          path: tars_build.log
          if-no-files-found: warn
