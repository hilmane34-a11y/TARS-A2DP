name: Build TARS MicroPython ESP32 A2DP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout TARS repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython

      - name: Setup MicroPython submodules
        run: |
          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1

      - name: Clone ESP-IDF
        run: |
          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0

      - name: Install ESP-IDF
        run: |
          cd esp-idf
          ./install.sh esp32

      - name: Build mpy-cross
        run: |
          cd micropython
          make -C mpy-cross

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules

      - name: Install TARS custom board
        shell: bash
        run: |
          BOARD_DIR="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP"

          mkdir -p "$BOARD_DIR"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.h" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.cmake" \
            "$BOARD_DIR/"

          cp \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth" \
            "$BOARD_DIR/"

          echo "=================================================="
          echo "TARS CUSTOM BOARD FILES"
          echo "=================================================="

          ls -la "$BOARD_DIR"

          echo ""
          echo "=================================================="
          echo "SDKCONFIG BLUETOOTH"
          echo "=================================================="

          cat "$BOARD_DIR/sdkconfig.bluetooth" || true

          echo ""
          echo "=================================================="
          echo "MPCONFIGBOARD.H"
          echo "=================================================="

          cat "$BOARD_DIR/mpconfigboard.h" || true

          echo ""
          echo "=================================================="
          echo "MPCONFIGBOARD.CMAKE"
          echo "=================================================="

          cat "$BOARD_DIR/mpconfigboard.cmake" || true

      - name: Check TARS A2DP source before build
        shell: bash
        run: |
          TARS_FILE="$GITHUB_WORKSPACE/modules/tars_a2dp/tars_a2dp.c"

          echo "=================================================="
          echo "TARS A2DP SOURCE CHECK"
          echo "=================================================="

          if [ ! -f "$TARS_FILE" ]; then
            echo "ERROR: tars_a2dp.c NOT FOUND"
            exit 1
          fi

          echo "FILE:"
          echo "$TARS_FILE"

          echo ""
          echo "=================================================="
          echo "FULL TARS A2DP SOURCE"
          echo "=================================================="

          cat "$TARS_FILE"

          echo ""
          echo "=================================================="
          echo "IMPORTANT INCLUDES"
          echo "=================================================="

          grep -n \
            -E "^#include.*(esp_bt|esp_a2dp|esp_gap|bluetooth|nimble)" \
            "$TARS_FILE" \
            || true

          echo ""
          echo "=================================================="
          echo "MP REGISTER MODULE"
          echo "=================================================="

          grep -n \
            -E "MP_REGISTER_MODULE" \
            "$TARS_FILE" \
            || true

      - name: Check TARS CMake modules
        shell: bash
        run: |
          echo "=================================================="
          echo "MAIN USER MODULE CMAKE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/micropython.cmake" \
            || true

          echo ""
          echo "=================================================="
          echo "TARS A2DP MODULE CMAKE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/tars_a2dp/micropython.cmake" \
            || true

          echo ""
          echo "=================================================="
          echo "TARS BLUETOOTH MODULE CMAKE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/tars_bluetooth/micropython.cmake" \
            || true

      - name: Build TARS MicroPython A2DP
        id: build_tars
        shell: bash
        continue-on-error: true
        run: |
          set +e

          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf ports/esp32/build-TARS_ESP32_A2DP

          echo "=================================================="
          echo "STARTING TARS BUILD"
          echo "=================================================="

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            2>&1 | tee "$GITHUB_WORKSPACE/tars_full_build.log"

          BUILD_RESULT=${PIPESTATUS[0]}

          echo "BUILD_EXIT_CODE=$BUILD_RESULT" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "BUILD EXIT CODE: $BUILD_RESULT"
          echo "=================================================="

          exit 0

      - name: Diagnose build error
        if: always()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"
          FULL_LOG="$GITHUB_WORKSPACE/tars_full_build.log"

          echo "=================================================="
          echo "FINAL BUILD RESULT"
          echo "=================================================="

          echo "BUILD_EXIT_CODE=${BUILD_EXIT_CODE:-unknown}"

          echo ""
          echo "=================================================="
          echo "FIRST BUILD ERRORS"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then

            grep -n -m 30 \
              -E "fatal error:|error:|undefined reference|CMake Error|FAILED:" \
              "$FULL_LOG" \
              || true

          else

            echo "FULL BUILD LOG NOT FOUND"

          fi

          echo ""
          echo "=================================================="
          echo "CONTEXT AROUND FIRST ERROR"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then

            FIRST_LINE=$(
              grep -n \
                -E "fatal error:|error:|undefined reference|CMake Error|FAILED:" \
                "$FULL_LOG" \
                | head -n 1 \
                | cut -d: -f1
            )

            if [ -n "$FIRST_LINE" ]; then

              START=$((FIRST_LINE - 20))

              if [ "$START" -lt 1 ]; then
                START=1
              fi

              END=$((FIRST_LINE + 40))

              sed -n "${START},${END}p" "$FULL_LOG"

            else

              echo "NO COMPILER ERROR PATTERN FOUND"

            fi

          fi

          echo ""
          echo "=================================================="
          echo "LAST 200 LINES OF BUILD"
          echo "=================================================="

          if [ -f "$FULL_LOG" ]; then

            tail -n 200 "$FULL_LOG"

          fi

          echo ""
          echo "=================================================="
          echo "CUSTOM BOARD CONFIG"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth" \
            || true

          echo ""
          echo "=================================================="
          echo "GENERATED SDKCONFIG IMPORTANT OPTIONS"
          echo "=================================================="

          if [ -f "$BUILD/sdkconfig" ]; then

            grep -n \
              -E \
              "CONFIG_BT_ENABLED|CONFIG_BT_BLUEDROID_ENABLED|CONFIG_BT_CLASSIC_ENABLED|CONFIG_BT_BLE_ENABLED|CONFIG_BT_NIMBLE_ENABLED|CONFIG_BT_A2DP_ENABLE" \
              "$BUILD/sdkconfig" \
              || true

          else

            echo "sdkconfig belum ditemukan"

          fi

          echo ""
          echo "=================================================="
          echo "CHECK BLUEDROID HEADERS"
          echo "=================================================="

          find \
            "$GITHUB_WORKSPACE/esp-idf/components/bt" \
            -type f \
            \( \
              -name "esp_bt_main.h" -o \
              -name "esp_a2dp_api.h" -o \
              -name "esp_gap_bt_api.h" -o \
              -name "esp_bt.h" \
            \) \
            -print \
            2>/dev/null \
            || true

          echo ""
          echo "=================================================="
          echo "CHECK NIMBLE HEADERS"
          echo "=================================================="

          find \
            "$GITHUB_WORKSPACE/esp-idf/components/bt" \
            -type f \
            \( \
              -name "ble_hs.h" -o \
              -name "nimble_port.h" \
            \) \
            -print \
            2>/dev/null \
            || true

          echo ""
          echo "=================================================="
          echo "CHECK MICROPYTHON NIMBLE SOURCE"
          echo "=================================================="

          grep -R -n \
            -E "MICROPY_BLUETOOTH_NIMBLE|modbluetooth_nimble|mpnimbleport" \
            "$GITHUB_WORKSPACE/micropython/ports/esp32" \
            "$GITHUB_WORKSPACE/micropython/extmod" \
            2>/dev/null \
            | head -n 200 \
            || true

          echo ""
          echo "=================================================="
          echo "CHECK TARS A2DP INCLUDE LINES"
          echo "=================================================="

          TARS_FILE="$GITHUB_WORKSPACE/modules/tars_a2dp/tars_a2dp.c"

          if [ -f "$TARS_FILE" ]; then

            grep -n \
              -E "^#include|esp_bt|esp_a2dp|esp_gap|MP_REGISTER_MODULE" \
              "$TARS_FILE" \
              || true

          fi

          echo ""
          echo "=================================================="
          echo "CHECK MODULE CMAKE CONTENT"
          echo "=================================================="

          find \
            "$GITHUB_WORKSPACE/modules" \
            -name "micropython.cmake" \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo ""
          echo "=================================================="
          echo "MAIN MODULE CMAKE"
          echo "=================================================="

          cat \
            "$GITHUB_WORKSPACE/modules/micropython.cmake" \
            || true

          echo ""
          echo "=================================================="
          echo "BUILD LOG FILES"
          echo "=================================================="

          find \
            "$BUILD/log" \
            -maxdepth 1 \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo ""
          echo "=================================================="
          echo "LAST 150 LINES OF IDF STDERR"
          echo "=================================================="

          for STDERR_FILE in \
            "$BUILD"/log/idf_py_stderr_output_*; do

            if [ -f "$STDERR_FILE" ]; then

              echo ""
              echo "----------------------------------------"
              echo "FILE: $STDERR_FILE"
              echo "----------------------------------------"

              tail -n 150 "$STDERR_FILE"

            fi

          done

          echo ""
          echo "=================================================="
          echo "MODULEDEFS TARS CHECK"
          echo "=================================================="

          if [ -f "$BUILD/genhdr/moduledefs.collected" ]; then

            grep -n \
              -E "tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.collected" \
              || true

          else

            echo "moduledefs.collected belum dibuat"

          fi

          echo ""
          echo "=================================================="
          echo "MODULEDEFS.H TARS CHECK"
          echo "=================================================="

          if [ -f "$BUILD/genhdr/moduledefs.h" ]; then

            grep -n \
              -E "TARS_A2DP|TARS_BLUETOOTH|tars_a2dp|tars_bluetooth" \
              "$BUILD/genhdr/moduledefs.h" \
              || true

          else

            echo "moduledefs.h belum dibuat"

          fi

          echo ""
          echo "=================================================="
          echo "SEARCH ALL BUILD ERRORS"
          echo "=================================================="

          if [ -d "$BUILD" ]; then

            grep -R -n -m 100 \
              -E "fatal error:|undefined reference|CMake Error|FAILED:" \
              "$BUILD/log" \
              2>/dev/null \
              || true

          fi

          echo ""
          echo "=================================================="
          echo "FIRMWARE STATUS"
          echo "=================================================="

          if [ -f "$BUILD/firmware.bin" ]; then

            ls -lh "$BUILD/firmware.bin"

          else

            echo "firmware.bin BELUM BERHASIL DIBUAT"

          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-Build-Diagnostic
          path: |
            tars_full_build.log
            micropython/ports/esp32/build-TARS_ESP32_A2DP/log/
            micropython/ports/esp32/build-TARS_ESP32_A2DP/sdkconfig
            micropython/ports/esp32/build-TARS_ESP32_A2DP/genhdr/
          if-no-files-found: warn

      - name: Fail workflow if build failed
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "FINAL BUILD STATUS"
          echo "=================================================="

          echo "BUILD_EXIT_CODE=${BUILD_EXIT_CODE:-unknown}"

          if [ "${BUILD_EXIT_CODE:-1}" != "0" ]; then

            echo ""
            echo "TARS BUILD FAILED"
            echo ""
            echo "PERIKSA BAGIAN:"
            echo "FIRST BUILD ERRORS"
            echo "CONTEXT AROUND FIRST ERROR"
            echo "LAST 200 LINES OF BUILD"

            exit 1

          fi

          echo ""
          echo "TARS BUILD SUCCESS"

      - name: Verify TARS modules
        if: success()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          echo "=================================================="
          echo "CHECK FIRMWARE"
          echo "=================================================="

          ls -lh "$BUILD/firmware.bin"

          echo ""
          echo "=================================================="
          echo "MODULEDEFS.COLLECTED TARS"
          echo "=================================================="

          grep -n \
            -E "tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr/moduledefs.collected" \
            || true

          echo ""
          echo "=================================================="
          echo "MODULEDEFS.H TARS"
          echo "=================================================="

          grep -n \
            -E "TARS_A2DP|TARS_BLUETOOTH|tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr/moduledefs.h" \
            || true

      - name: Prepare firmware
        if: success()
        shell: bash
        run: |
          mkdir -p output

          cp \
            "$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin" \
            "$GITHUB_WORKSPACE/output/TARS-MicroPython-ESP32-A2DP.bin"

          echo "=================================================="
          echo "OUTPUT FIRMWARE"
          echo "=================================================="

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-A2DP
          path: output/TARS-MicroPython-ESP32-A2DP.bin
          if-no-files-found: error
