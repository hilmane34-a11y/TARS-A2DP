      - name: BUILD TARS FIRMWARE
        id: build_tars
        shell: bash
        continue-on-error: true
        run: |
          cd micropython/ports/esp32
          make BOARD=TARS_ESP32_A2DP

      - name: DIAGNOSE BUILD ERROR
        if: always()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          echo "=================================================="
          echo "FINAL BUILD STATUS"
          echo "=================================================="
          echo "BUILD_EXIT_CODE=${{ steps.build_tars.outcome }}"

          echo ""
          echo "=================================================="
          echo "SEARCH FIRST COMPILER ERRORS"
          echo "=================================================="

          find "$BUILD/log" -type f 2>/dev/null | while read LOG; do
            echo "----- $LOG -----"
            grep -n -m 20 -E \
              "fatal error:|error:|undefined reference|FAILED:|CMake Error" \
              "$LOG" 2>/dev/null || true
          done

          echo ""
          echo "=================================================="
          echo "CHECK TARS A2DP SOURCE FILE"
          echo "=================================================="

          TARS_FILE="$GITHUB_WORKSPACE/modules/tars_a2dp/tars_a2dp.c"

          if [ -f "$TARS_FILE" ]; then
            echo "FILE FOUND:"
            echo "$TARS_FILE"
            echo ""

            grep -n -E \
              "esp_bt|esp_bluedroid|esp_a2d|MP_REGISTER_MODULE" \
              "$TARS_FILE" || true
          else
            echo "ERROR: tars_a2dp.c NOT FOUND"
          fi

          echo ""
          echo "=================================================="
          echo "CHECK BLUETOOTH HEADERS"
          echo "=================================================="

          find "$GITHUB_WORKSPACE/esp-idf/components/bt" \
            -type f \
            \( \
              -name "esp_bt.h" -o \
              -name "esp_bt_main.h" -o \
              -name "esp_gap_bt_api.h" -o \
              -name "esp_a2dp_api.h" \
            \) \
            2>/dev/null || true

          echo ""
          echo "=================================================="
          echo "CHECK MODULE CMAKE"
          echo "=================================================="

          CMAKE_FILE="$GITHUB_WORKSPACE/modules/tars_a2dp/micropython.cmake"

          if [ -f "$CMAKE_FILE" ]; then
            cat "$CMAKE_FILE"
          else
            echo "ERROR: micropython.cmake NOT FOUND"
          fi

          echo ""
          echo "=================================================="
          echo "CHECK SDKCONFIG BLUETOOTH"
          echo "=================================================="

          if [ -f "$BUILD/sdkconfig" ]; then
            grep -n -E \
              "CONFIG_BT_ENABLED|CONFIG_BT_BLUEDROID_ENABLED|CONFIG_BT_CLASSIC_ENABLED|CONFIG_BT_A2DP" \
              "$BUILD/sdkconfig" || true
          else
            echo "sdkconfig belum dibuat atau build gagal terlalu awal"
          fi

          echo ""
          echo "=================================================="
          echo "CHECK BUILD COMMAND LOGS"
          echo "=================================================="

          if [ -d "$BUILD/log" ]; then
            find "$BUILD/log" -type f -maxdepth 1 -print
          else
            echo "BUILD LOG DIRECTORY NOT FOUND"
          fi

          echo ""
          echo "=================================================="
          echo "LAST 150 LINES OF STDERR"
          echo "=================================================="

          for LOG in "$BUILD"/log/*stderr*; do
            if [ -f "$LOG" ]; then
              echo ""
              echo "----- $LOG -----"
              tail -n 150 "$LOG"
            fi
          done

          echo ""
          echo "=================================================="
          echo "SEARCH ERROR IN ENTIRE BUILD DIRECTORY"
          echo "=================================================="

          grep -R -n -m 50 -E \
            "fatal error:|undefined reference|CMake Error|FAILED:" \
            "$BUILD" \
            2>/dev/null || true

      - name: FAIL IF BUILD FAILED
        if: steps.build_tars.outcome == 'failure'
        run: |
          echo "=================================================="
          echo "TARS BUILD FAILED"
          echo "SEE DIAGNOSE BUILD ERROR ABOVE"
          echo "=================================================="
          exit 1
