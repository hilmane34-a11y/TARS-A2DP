name: Build Utama TARS V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout TARS repository
        uses: actions/checkout@v4

      - name: Check module files
        run: |
          echo "===== MODULE STRUCTURE ====="
          find modules -type f | sort

          echo ""
          echo "===== MAIN CMAKE ====="
          cat modules/micropython.cmake

          echo ""
          echo "===== A2DP SOURCE ====="
          cat modules/tars_a2dp/tars_a2dp.c

          echo ""
          echo "===== BLUETOOTH SOURCE ====="
          cat modules/tars_bluetooth/tars_bluetooth.c

      - name: Verify module files
        run: |
          test -f modules/micropython.cmake
          test -f modules/tars_a2dp/tars_a2dp.c
          test -f modules/tars_bluetooth/tars_bluetooth.c

          echo "ALL TARS MODULE FILES FOUND"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0 \
            binutils

      - name: Clone MicroPython
        run: |
          git clone \
            --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython

      - name: Setup MicroPython submodules
        run: |
          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1

      - name: Clone ESP-IDF
        run: |
          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0

      - name: Install ESP-IDF
        run: |
          cd esp-idf

          ./install.sh esp32

      - name: Build mpy-cross
        run: |
          cd micropython

          make -C mpy-cross

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 submodules

      - name: Build TARS MicroPython
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf ports/esp32/build-ESP32_GENERIC

          make -C ports/esp32 \
            BOARD=ESP32_GENERIC \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            V=1

      - name: Verify TARS modules compiled
        run: |
          BUILD="micropython/ports/esp32/build-ESP32_GENERIC"

          echo "===== SEARCH A2DP OBJECT ====="

          find "$BUILD" -type f \
            | grep "tars_a2dp" \
            || true

          echo ""
          echo "===== SEARCH BLUETOOTH OBJECT ====="

          find "$BUILD" -type f \
            | grep "tars_bluetooth" \
            || true

          echo ""
          echo "===== SEARCH QSTR ====="

          grep -R \
            -E "tars_a2dp|tars_bluetooth" \
            "$BUILD/genhdr" \
            2>/dev/null \
            || true

      - name: Verify modules linked into firmware
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          ELF="micropython/ports/esp32/build-ESP32_GENERIC/micropython.elf"

          echo "===== CHECK ELF EXISTS ====="
          test -f "$ELF"

          echo ""
          echo "===== SEARCH MODULE SYMBOLS ====="

          xtensa-esp32-elf-nm "$ELF" \
            | grep -E \
              "tars_a2dp_user_cmodule|tars_bluetooth_user_cmodule" \
            || true

          echo ""
          echo "===== SEARCH MODULE NAMES IN ELF ====="

          strings "$ELF" \
            | grep -E \
              "^tars_a2dp$|^tars_bluetooth$" \
            || true

      - name: Prepare firmware
        run: |
          mkdir -p output

          cp \
            micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin \
            output/TARS-MicroPython-ESP32-UTAMA-V1.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:
          name: TARS-MicroPython-ESP32-UTAMA-V1
          path: output/TARS-MicroPython-ESP32-UTAMA-V1.bin
