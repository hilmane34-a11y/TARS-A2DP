name: Build TARS MicroPython ESP32 A2DP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ cmake ninja-build python3 python3-pip flex bison gperf ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone --depth 1 https://github.com/micropython/micropython.git micropython
          cd micropython
          git submodule update --init --recursive --depth 1

      - name: Clone ESP-IDF
        run: |
          git clone --depth 1 --branch v5.5.2 https://github.com/espressif/esp-idf.git esp-idf
          cd esp-idf
          git submodule update --init --recursive --filter=tree:0

      - name: Install ESP-IDF
        run: |
          cd esp-idf
          ./install.sh esp32

      - name: Build mpy-cross
        run: |
          cd micropython
          make -C mpy-cross

      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"
          cd "$GITHUB_WORKSPACE/micropython"
          make -C ports/esp32 submodules

      - name: Install TARS board
        shell: bash
        run: |
          BOARD_DIR="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP"
          mkdir -p "$BOARD_DIR"

          cp "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.h" "$BOARD_DIR/"
          cp "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/mpconfigboard.cmake" "$BOARD_DIR/"
          cp "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth" "$BOARD_DIR/"
          cp "$GITHUB_WORKSPACE/boards/TARS_ESP32_A2DP/partitions.csv" "$BOARD_DIR/"

      - name: Enable HTTPS Certificate Bundle
        shell: bash
        run: |
          BOARD="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP/sdkconfig.bluetooth"

          sed -i '/CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=/d' "$BOARD"
          sed -i '/CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=/d' "$BOARD"
          sed -i '/CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=/d' "$BOARD"
          sed -i '/CONFIG_ESP_TLS_USE_SECURE_ELEMENT=/d' "$BOARD"

          cat >> "$BOARD" << 'EOF'

          # HTTPS / TLS untuk TARS Cloud TTS
          CONFIG_MBEDTLS_SSL_ALPN=y

          # Certificate Bundle AKTIF
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=n
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y

          # HTTPS client
          CONFIG_ESP_TLS_USE_SECURE_ELEMENT=n
          EOF

          echo "===== TARS HTTPS CONFIG ====="
          tail -n 20 "$BOARD"

      - name: Patch A2DP queue
        shell: bash
        run: |
          A2DP_FILE="$GITHUB_WORKSPACE/esp-idf/components/bt/host/bluedroid/btc/profile/std/a2dp/btc_a2dp_source.c"

          if [ -f "$A2DP_FILE" ]; then
            sed -i \
              's/#define MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ     (27)/#define MAX_OUTPUT_A2DP_SRC_FRAME_QUEUE_SZ     (16)/' \
              "$A2DP_FILE"
          fi

      - name: Build TARS firmware
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"
          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf ports/esp32/build-TARS_ESP32_A2DP

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake" \
            2>&1 | tee "$GITHUB_WORKSPACE/tars_build.log"

      - name: Show HTTPS configuration
        if: always()
        shell: bash
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP"

          echo "===== MBEDTLS CONFIG ====="

          if [ -f "$BUILD/sdkconfig" ]; then
            grep -E \
              "CONFIG_MBEDTLS_SSL|CONFIG_MBEDTLS_CERTIFICATE|CONFIG_ESP_TLS" \
              "$BUILD/sdkconfig" \
              || true
          fi

          echo "===== LAST BUILD LOG ====="
          tail -n 100 "$GITHUB_WORKSPACE/tars_build.log" || true

      - name: Prepare firmware
        shell: bash
        run: |
          mkdir -p output

          cp \
            "$GITHUB_WORKSPACE/micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin" \
            "$GITHUB_WORKSPACE/output/TARS-MicroPython-ESP32-A2DP.bin"

          ls -lh output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-A2DP
          path: output/TARS-MicroPython-ESP32-A2DP.bin

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-Build-Log
          path: tars_build.log
          if-no-files-found: warn
