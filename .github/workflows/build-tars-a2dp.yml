name: Build TARS ESP32 A2DP Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout TARS repository
        uses: actions/checkout@v4


      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0


      - name: Clone MicroPython
        run: |
          git clone \
            --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython


      - name: Setup MicroPython submodules
        run: |
          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1


      - name: Clone ESP-IDF v5.5.2
        run: |
          git clone \
            --depth 1 \
            --branch v5.5.2 \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          cd esp-idf

          git submodule update \
            --init \
            --recursive \
            --filter=tree:0


      - name: Install ESP-IDF
        run: |
          cd esp-idf

          ./install.sh esp32


      - name: Build mpy-cross
        run: |
          cd micropython

          make -C mpy-cross


      - name: Create TARS A2DP custom board
        run: |
          cd micropython/ports/esp32/boards

          cp -a \
            ESP32_GENERIC \
            TARS_ESP32_A2DP


      - name: Configure TARS A2DP board
        run: |
          BOARD_DIR="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/TARS_ESP32_A2DP"

          cat > "$BOARD_DIR/mpconfigboard.cmake" <<'EOF'
          set(SDKCONFIG_DEFAULTS
              boards/sdkconfig.base
              boards/sdkconfig.ble
              ${MICROPY_BOARD_DIR}/sdkconfig.a2dp
          )
          EOF

          cat > "$BOARD_DIR/sdkconfig.a2dp" <<'EOF'
          CONFIG_BT_ENABLED=y

          CONFIG_BT_BLUEDROID_ENABLED=y

          CONFIG_BT_CLASSIC_ENABLED=y

          CONFIG_BT_A2DP_ENABLE=y

          CONFIG_BTDM_CTRL_MODE_BTDM=y
          EOF


      - name: Setup ESP32 submodules
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            submodules


      - name: Build TARS A2DP MicroPython
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          rm -rf \
            ports/esp32/build-TARS_ESP32_A2DP

          make -C ports/esp32 \
            BOARD=TARS_ESP32_A2DP \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake"


      - name: Verify TARS A2DP module in ELF
        run: |
          ELF="micropython/ports/esp32/build-TARS_ESP32_A2DP/micropython.elf"

          echo "===== VERIFY ELF ====="

          if [ ! -f "$ELF" ]; then
            echo "ERROR: micropython.elf not found"
            exit 1
          fi

          NM_TOOL=$(find \
            "$HOME/.espressif/tools" \
            -name xtensa-esp32-elf-nm \
            -type f \
            | head -n 1)

          echo "Using nm: $NM_TOOL"

          "$NM_TOOL" "$ELF" \
            | grep -i tars_a2dp \
            || true

          echo "===== ELF BUILD VERIFIED ====="


      - name: Prepare firmware
        run: |
          mkdir -p output

          cp \
            micropython/ports/esp32/build-TARS_ESP32_A2DP/firmware.bin \
            output/TARS-MicroPython-ESP32-A2DP-FINAL.bin


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-A2DP-FINAL
          path: output/TARS-MicroPython-ESP32-A2DP-FINAL.bin
