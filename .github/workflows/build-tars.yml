name: Build TARS A2DP V2 - Verified

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 60

steps:

  # ==========================================
  # CHECKOUT REPOSITORY
  # ==========================================

  - name: Checkout TARS repository
    uses: actions/checkout@v4


  # ==========================================
  # INSTALL SYSTEM PACKAGES
  # ==========================================

  - name: Install system packages
    run: |
      sudo apt-get update

      sudo apt-get install -y \
        git \
        make \
        gcc \
        g++ \
        cmake \
        ninja-build \
        python3 \
        python3-pip \
        flex \
        bison \
        gperf \
        ccache \
        libffi-dev \
        libssl-dev \
        dfu-util \
        libusb-1.0-0


  # ==========================================
  # SHOW MODULE FILES
  # ==========================================

  - name: Verify repository structure
    run: |
      echo "===== REPOSITORY ====="
      pwd

      echo ""
      echo "===== MODULE FILES ====="

      find modules -type f -print

      echo ""
      echo "===== TOP LEVEL CMAKE ====="

      cat modules/micropython.cmake

      echo ""
      echo "===== TARS A2DP CMAKE ====="

      cat modules/tars_a2dp/micropython.cmake

      echo ""
      echo "===== CHECK MODULE SOURCE ====="

      grep -n "MP_REGISTER_MODULE" \
        modules/tars_a2dp/tars_a2dp.c

      echo ""
      echo "===== CHECK MODULE NAME ====="

      grep -n "tars_a2dp" \
        modules/tars_a2dp/tars_a2dp.c


  # ==========================================
  # CLONE MICROPYTHON
  # ==========================================

  - name: Clone MicroPython
    run: |
      git clone \
        --depth 1 \
        https://github.com/micropython/micropython.git \
        micropython


  # ==========================================
  # MICROPYTHON SUBMODULES
  # ==========================================

  - name: Setup MicroPython submodules
    run: |
      cd micropython

      git submodule update \
        --init \
        --recursive \
        --depth 1


  # ==========================================
  # CLONE ESP-IDF
  # ==========================================

  - name: Clone ESP-IDF
    run: |
      git clone \
        --depth 1 \
        --branch v5.5.2 \
        https://github.com/espressif/esp-idf.git \
        esp-idf

      cd esp-idf

      git submodule update \
        --init \
        --recursive \
        --filter=tree:0


  # ==========================================
  # INSTALL ESP-IDF
  # ==========================================

  - name: Install ESP-IDF
    run: |
      cd esp-idf

      ./install.sh esp32


  # ==========================================
  # BUILD MPY-CROSS
  # ==========================================

  - name: Build mpy-cross
    run: |
      cd micropython

      make -C mpy-cross


  # ==========================================
  # SETUP ESP32 SUBMODULES
  # ==========================================

  - name: Setup ESP32 submodules
    shell: bash
    run: |
      . "$GITHUB_WORKSPACE/esp-idf/export.sh"

      cd "$GITHUB_WORKSPACE/micropython"

      make -C ports/esp32 submodules


  # ==========================================
  # CLEAN OLD BUILD
  # ==========================================

  - name: Clean previous ESP32 build
    run: |
      rm -rf \
        micropython/ports/esp32/build-ESP32_GENERIC


  # ==========================================
  # BUILD TARS MICROPYTHON
  # ==========================================

  - name: Build TARS MicroPython with A2DP module
    shell: bash
    run: |
      . "$GITHUB_WORKSPACE/esp-idf/export.sh"

      cd "$GITHUB_WORKSPACE/micropython"

      make -C ports/esp32 \
        BOARD=ESP32_GENERIC \
        USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake"


  # ==========================================
  # VERIFY BUILD FILE EXISTS
  # ==========================================

  - name: Verify firmware output
    run: |
      FIRMWARE="micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin"
      ELF="micropython/ports/esp32/build-ESP32_GENERIC/micropython.elf"

      echo "===== CHECK FIRMWARE ====="

      test -f "$FIRMWARE"

      ls -lh "$FIRMWARE"

      echo ""
      echo "===== CHECK ELF ====="

      test -f "$ELF"

      ls -lh "$ELF"


  # ==========================================
  # VERIFY TARS A2DP SYMBOLS
  # ==========================================

  - name: Verify TARS A2DP compiled into ELF
    shell: bash
    run: |
      ELF="micropython/ports/esp32/build-ESP32_GENERIC/micropython.elf"

      echo "===== SEARCHING FOR TARS A2DP SYMBOLS ====="

      TOOL=$(find "$HOME/.espressif/tools" \
        -type f \
        -name xtensa-esp32-elf-nm \
        | head -n 1)

      if [ -z "$TOOL" ]; then
        echo "ERROR: xtensa-esp32-elf-nm not found"
        exit 1
      fi

      echo "Using:"
      echo "$TOOL"

      echo ""
      echo "===== TARS A2DP SYMBOLS ====="

      "$TOOL" \
        "$ELF" \
        | grep "tars_a2dp" \
        || {
          echo ""
          echo "ERROR: No tars_a2dp symbol found in ELF"
          exit 1
        }

      echo ""
      echo "SUCCESS: TARS A2DP symbols found in firmware ELF"


  # ==========================================
  # VERIFY SOURCE WAS COMPILED
  # ==========================================

  - name: Verify TARS A2DP object file
    run: |
      BUILD="micropython/ports/esp32/build-ESP32_GENERIC"

      echo "===== SEARCHING OBJECT FILE ====="

      find "$BUILD" \
        -type f \
        -name "*tars_a2dp*.obj" \
        -print

      COUNT=$(find "$BUILD" \
        -type f \
        -name "*tars_a2dp*.obj" \
        | wc -l)

      echo ""
      echo "Object files found: $COUNT"

      if [ "$COUNT" -eq 0 ]; then
        echo "ERROR: tars_a2dp.c was not compiled"
        exit 1
      fi


  # ==========================================
  # VERIFY MODULE NAME INSIDE ELF
  # ==========================================

  - name: Inspect TARS module strings
    shell: bash
    run: |
      ELF="micropython/ports/esp32/build-ESP32_GENERIC/micropython.elf"

      TOOL=$(find "$HOME/.espressif/tools" \
        -type f \
        -name xtensa-esp32-elf-strings \
        | head -n 1)

      if [ -z "$TOOL" ]; then
        echo "WARNING: xtensa-esp32-elf-strings not found"
        exit 0
      fi

      echo "===== SEARCHING MODULE STRINGS ====="

      "$TOOL" "$ELF" \
        | grep -E "tars_a2dp|TARS A2DP" \
        || echo "No readable TARS A2DP string found"


  # ==========================================
  # PREPARE FIRMWARE
  # ==========================================

  - name: Prepare firmware
    run: |
      mkdir -p output

      cp \
        micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin \
        output/TARS-MicroPython-ESP32-A2DP-V2.bin

      echo "===== FINAL FIRMWARE ====="

      ls -lh output/


  # ==========================================
  # CREATE BUILD INFO
  # ==========================================

  - name: Create build information
    shell: bash
    run: |
      {
        echo "TARS MicroPython A2DP V2"
        echo ""
        echo "Build date:"
        date -u
        echo ""
        echo "Commit:"
        git rev-parse HEAD
        echo ""
        echo "Module:"
        grep "MP_REGISTER_MODULE" \
          modules/tars_a2dp/tars_a2dp.c
      } > output/BUILD-INFO.txt

      cat output/BUILD-INFO.txt


  # ==========================================
  # UPLOAD ARTIFACT
  # ==========================================

  - name: Upload verified firmware
    uses: actions/upload-artifact@v4
    with:
      name: TARS-MicroPython-ESP32-A2DP-V2
      path: |
        output/TARS-MicroPython-ESP32-A2DP-V2.bin
        output/BUILD-INFO.txt
