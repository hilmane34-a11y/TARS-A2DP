name: Build TARS MicroPython ESP32 V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==============================
      # AMBIL REPOSITORY TARS
      # ==============================
      - name: Checkout TARS repository
        uses: actions/checkout@v4


      # ==============================
      # INSTALL PACKAGE
      # ==============================
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0


      # ==============================
      # CLONE MICROPYTHON
      # ==============================
      - name: Clone MicroPython
        run: |
          git clone --depth 1 \
            https://github.com/micropython/micropython.git \
            micropython


      # ==============================
      # SETUP SUBMODULE MICROPYTHON
      # ==============================
      - name: Setup MicroPython submodules
        run: |
          cd micropython

          git submodule update \
            --init \
            --recursive \
            --depth 1


      # ==============================
      # BUILD MPY-CROSS
      # ==============================
      - name: Build mpy-cross
        run: |
          cd micropython

          make -C mpy-cross


      # ==============================
      # SETUP ESP32 PORT
      # ==============================
      - name: Setup ESP32 submodules
        run: |
          cd micropython

          make -C ports/esp32 submodules


      # ==============================
      # BUILD TARS
      # DENGAN CUSTOM MODULE
      # ==============================
      - name: Build TARS MicroPython V4
        run: |
          cd micropython

          make -C ports/esp32 \
            BOARD=ESP32_GENERIC \
            USER_C_MODULES="$GITHUB_WORKSPACE/modules/micropython.cmake"


      # ==============================
      # SIAPKAN FIRMWARE
      # ==============================
      - name: Prepare firmware
        run: |
          mkdir -p output

          cp \
            micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin \
            output/TARS-MicroPython-ESP32-V4.bin


      # ==============================
      # UPLOAD HASIL
      # ==============================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32-V4
          path: output/TARS-MicroPython-ESP32-V4.bin
