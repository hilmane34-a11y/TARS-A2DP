name: Build TARS MicroPython ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: micropython/build-esp32

    steps:
      - name: Checkout TARS repository
        uses: actions/checkout@v4

      - name: Clone MicroPython
        run: |
          git clone --depth 1 https://github.com/micropython/micropython.git

      - name: Build mpy-cross
        run: |
          make -C micropython/mpy-cross

      - name: Build ESP32 firmware
        run: |
          cd micropython/ports/esp32
          make submodules
          make BOARD=ESP32_GENERIC

      - name: Copy firmware
        run: |
          mkdir -p output
          cp micropython/ports/esp32/build-ESP32_GENERIC/firmware.bin output/TARS-MicroPython-ESP32.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-MicroPython-ESP32
          path: output/TARS-MicroPython-ESP32.bin
